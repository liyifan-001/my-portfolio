<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物大战僵尸</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
            background: #0a0a14;
            background-image:
                radial-gradient(ellipse 80% 60% at 15% 20%, rgba(34, 197, 94, 0.18) 0%, transparent 60%),
                radial-gradient(ellipse 70% 50% at 85% 80%, rgba(132, 204, 22, 0.14) 0%, transparent 60%),
                linear-gradient(135deg, #0a0a14 0%, #0f1a14 50%, #14142b 100%);
            background-attachment: fixed;
            padding: 16px;
            color: #e2e8f0;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(15, 18, 36, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 10px 14px;
        }

        .sun-counter {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(251, 191, 36, 0.12);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 12px;
            padding: 6px 14px;
            min-width: 90px;
        }
        .sun-icon {
            width: 22px; height: 22px;
            border-radius: 50%;
            background: radial-gradient(circle, #fde047, #f59e0b);
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.6);
            flex-shrink: 0;
        }
        .sun-value {
            font-size: 18px;
            font-weight: 700;
            color: #fbbf24;
            font-variant-numeric: tabular-nums;
        }

        .cards {
            display: flex;
            gap: 8px;
            flex: 1;
            flex-wrap: wrap;
        }

        .card {
            width: 64px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 6px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .card:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(251, 191, 36, 0.3); }
        .card.selected {
            background: rgba(251, 191, 36, 0.18);
            border-color: #fbbf24;
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.4);
        }
        .card.disabled { opacity: 0.4; cursor: not-allowed; }
        .card .icon { font-size: 26px; line-height: 1.2; }
        .card .cost {
            font-size: 11px;
            color: #fbbf24;
            font-weight: 600;
            margin-top: 2px;
        }
        .card .cooldown {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            transform-origin: bottom;
        }

        .wave-info {
            font-size: 12px;
            color: #94a3b8;
            text-align: right;
            white-space: nowrap;
        }
        .wave-info b { color: #22d3ee; font-size: 14px; }

        .board-wrap {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        canvas { display: block; background: #4a7c3a; }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(8, 12, 20, 0.88);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            text-align: center;
            padding: 30px;
            transition: opacity 0.3s ease;
        }
        .overlay.hidden { opacity: 0; pointer-events: none; }
        .overlay-title {
            font-size: 30px;
            font-weight: 800;
            background: linear-gradient(135deg, #84cc16, #fbbf24);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .overlay-text {
            font-size: 13px; color: #94a3b8; line-height: 1.7; max-width: 340px;
        }
        .overlay-score { font-size: 13px; color: #64748b; }
        .overlay-score b { color: #fbbf24; font-size: 18px; }
        .btn {
            padding: 12px 32px;
            background: linear-gradient(135deg, #84cc16, #65a30d);
            color: #0a0a14;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            font-family: inherit; letter-spacing: 0.5px;
            box-shadow: 0 6px 24px rgba(132, 204, 22, 0.4);
            transition: all 0.2s ease;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(132, 204, 22, 0.55); }

        .hint {
            font-size: 11px; color: #475569; text-align: center; line-height: 1.6;
        }
        .hint kbd {
            display: inline-block; padding: 1px 6px;
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 4px; font-size: 10px; color: #cbd5e1; margin: 0 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <div class="sun-counter">
                <div class="sun-icon"></div>
                <div class="sun-value" id="sun">50</div>
            </div>
            <div class="cards" id="cards"></div>
            <div class="wave-info">第 <b id="wave">1</b> 波</div>
        </div>

        <div class="board-wrap">
            <canvas id="game" width="720" height="400"></canvas>
            <div class="overlay" id="overlay">
                <div class="overlay-title" id="overlayTitle">植物大战僵尸</div>
                <div class="overlay-text" id="overlayText">
                    点击阳光收集，选择植物卡片种到草坪上<br>
                    阻止僵尸越过你的防线！<br><br>
                    <b style="color:#fbbf24">向日葵</b> 产阳光 ·
                    <b style="color:#22d3ee">豌豆射手</b> 攻击 ·
                    <b style="color:#a78bfa">坚果墙</b> 防御 ·
                    <b style="color:#ef4444">樱桃炸弹</b> 爆炸
                </div>
                <button class="btn" id="startBtn">开始游戏</button>
            </div>
        </div>

        <div class="hint">
            <kbd>点击</kbd> 阳光收集 · <kbd>点击</kbd> 卡片选植物 · <kbd>点击</kbd> 草坪种植 · <kbd>1-4</kbd> 快捷选卡
        </div>
    </div>

    <script>
    (function () {
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;

        const sunEl = document.getElementById('sun');
        const waveEl = document.getElementById('wave');
        const cardsEl = document.getElementById('cards');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayText = document.getElementById('overlayText');
        const startBtn = document.getElementById('startBtn');

        // 网格：5 行 9 列
        const COLS = 9, ROWS = 5;
        const CELL_W = 80, CELL_H = 80;
        const GRID_X = 0, GRID_Y = 0;

        // 植物配置
        const PLANTS = {
            sunflower: { name: '向日葵', cost: 50, hp: 60, cooldown: 7500, icon: '🌻', color: '#fbbf24', type: 'sun' },
            peashooter: { name: '豌豆射手', cost: 100, hp: 60, cooldown: 7500, icon: '🌱', color: '#22c55e', type: 'shoot' },
            wallnut: { name: '坚果墙', cost: 50, hp: 400, cooldown: 15000, icon: '🌰', color: '#a78bfa', type: 'wall' },
            cherry: { name: '樱桃炸弹', cost: 150, hp: 1, cooldown: 20000, icon: '🍒', color: '#ef4444', type: 'bomb' }
        };
        const PLANT_KEYS = ['sunflower', 'peashooter', 'wallnut', 'cherry'];

        // 僵尸配置
        const ZOMBIES = {
            normal: { hp: 100, speed: 0.25, damage: 12, color: '#94a3b8' },
            cone:   { hp: 220, speed: 0.25, damage: 12, color: '#f59e0b' },
            bucket: { hp: 450, speed: 0.22, damage: 14, color: '#64748b' }
        };

        // 状态
        let sun, plants, zombies, bullets, suns, particles, explosions;
        let selectedPlant, cooldowns, lastSunDrop, wave, waveTimer;
        let zombiesToSpawn, zombiesSpawned, waveActive, running, gameOver, win;
        let lastTime, mouseGrid;

        function reset() {
            sun = 50;
            plants = []; zombies = []; bullets = []; suns = []; particles = []; explosions = [];
            selectedPlant = null;
            cooldowns = {};
            PLANT_KEYS.forEach(k => cooldowns[k] = 0);
            lastSunDrop = 0;
            wave = 0; waveTimer = 0;
            zombiesToSpawn = 0; zombiesSpawned = 0; waveActive = false;
            gameOver = false; win = false;
            mouseGrid = null;
            updateSun();
            renderCards();
            waveEl.textContent = wave;
        }

        function startGame() {
            reset();
            running = true;
            startNextWave();
            overlay.classList.add('hidden');
            lastTime = performance.now();
            requestAnimationFrame(loop);
        }

        function startNextWave() {
            wave++;
            waveActive = true;
            zombiesToSpawn = 3 + wave * 2;
            zombiesSpawned = 0;
            waveTimer = 0;
            waveEl.textContent = wave;
        }

        function spawnZombie() {
            const row = Math.floor(Math.random() * ROWS);
            let type = 'normal';
            const r = Math.random();
            if (wave >= 4 && r < 0.15) type = 'bucket';
            else if (wave >= 2 && r < 0.4) type = 'cone';
            const cfg = ZOMBIES[type];
            const hpScale = 1 + (wave - 1) * 0.08;
            zombies.push({
                x: W + 20,
                y: GRID_Y + row * CELL_H + CELL_H / 2,
                row: row,
                type: type,
                hp: cfg.hp * hpScale,
                maxHp: cfg.hp * hpScale,
                speed: cfg.speed,
                damage: cfg.damage,
                color: cfg.color,
                eating: null,
                eatTimer: 0,
                walkPhase: Math.random() * Math.PI * 2,
                hurtFlash: 0
            });
        }

        function updateSun() { sunEl.textContent = sun; }

        function renderCards() {
            cardsEl.innerHTML = '';
            PLANT_KEYS.forEach((k, i) => {
                const p = PLANTS[k];
                const card = document.createElement('div');
                card.className = 'card';
                if (selectedPlant === k) card.classList.add('selected');
                if (sun < p.cost || cooldowns[k] > performance.now()) card.classList.add('disabled');
                card.innerHTML =
                    '<div class="icon">' + p.icon + '</div>' +
                    '<div class="cost">☀' + p.cost + '</div>' +
                    '<div class="cooldown" id="cd-' + k + '"></div>';
                card.addEventListener('click', () => selectPlant(k));
                cardsEl.appendChild(card);
            });
            updateCooldowns();
        }

        function updateCooldowns() {
            const now = performance.now();
            PLANT_KEYS.forEach(k => {
                const p = PLANTS[k];
                const cdEl = document.getElementById('cd-' + k);
                if (!cdEl) return;
                const remain = cooldowns[k] - now;
                if (remain > 0) {
                    const pct = remain / p.cooldown;
                    cdEl.style.transform = 'scaleY(' + pct + ')';
                    cdEl.style.opacity = '1';
                } else {
                    cdEl.style.transform = 'scaleY(0)';
                    cdEl.style.opacity = '0';
                }
            });
        }

        function selectPlant(k) {
            const p = PLANTS[k];
            if (sun < p.cost) return;
            if (cooldowns[k] > performance.now()) return;
            selectedPlant = (selectedPlant === k) ? null : k;
            renderCards();
        }

        function plantAt(col, row) {
            if (!selectedPlant) return;
            // 检查格子是否被占
            if (plants.some(p => p.col === col && p.row === row)) return;
            const k = selectedPlant;
            const p = PLANTS[k];
            if (sun < p.cost) return;
            if (cooldowns[k] > performance.now()) return;
            sun -= p.cost;
            cooldowns[k] = performance.now() + p.cooldown;
            plants.push({
                type: k,
                col: col, row: row,
                x: GRID_X + col * CELL_W + CELL_W / 2,
                y: GRID_Y + row * CELL_H + CELL_H / 2,
                hp: p.hp, maxHp: p.hp,
                shootTimer: 0,
                sunTimer: 5000 + Math.random() * 3000,
                bombTimer: 800,
                hurtFlash: 0
            });
            selectedPlant = null;
            updateSun();
            renderCards();
        }

        function spawnSun(x, y, fromSky) {
            suns.push({
                x: x, y: fromSky ? -20 : y,
                targetY: fromSky ? (100 + Math.random() * 250) : y,
                fromSky: fromSky,
                life: 8000,
                value: 25,
                bob: 0
            });
        }

        function collectSun(s) {
            sun += s.value;
            updateSun();
            renderCards();
            // 飞向计数器粒子
            for (let i = 0; i < 6; i++) {
                particles.push({
                    x: s.x, y: s.y,
                    vx: (Math.random() - 0.5) * 3,
                    vy: -2 - Math.random() * 2,
                    life: 20, maxLife: 20,
                    color: '#fde047', size: 3
                });
            }
        }

        function fireBullet(plant) {
            bullets.push({
                x: plant.x + 20, y: plant.y - 5,
                vx: 6, vy: 0,
                damage: 20,
                row: plant.row,
                life: 150
            });
        }

        function explodeBomb(plant) {
            explosions.push({
                x: plant.x, y: plant.y,
                radius: 0, maxRadius: CELL_W * 1.5,
                life: 30, maxLife: 30
            });
            // 范围伤害：3x3 区域的僵尸
            zombies.forEach(z => {
                if (Math.abs(z.x - plant.x) < CELL_W * 1.5 && z.row === plant.row) {
                    z.hp -= 1800;
                    z.hurtFlash = 10;
                }
                // 也波及上下行
                if (Math.abs(z.x - plant.x) < CELL_W && Math.abs(z.y - plant.y) < CELL_H * 1.5) {
                    z.hp -= 1800;
                    z.hurtFlash = 10;
                }
            });
            // 爆炸粒子
            for (let i = 0; i < 30; i++) {
                const a = Math.random() * Math.PI * 2;
                const s = 2 + Math.random() * 5;
                particles.push({
                    x: plant.x, y: plant.y,
                    vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                    life: 30, maxLife: 30,
                    color: i % 2 ? '#ef4444' : '#fbbf24',
                    size: 3 + Math.random() * 4
                });
            }
        }

        function update(dt) {
            if (gameOver || win || !running) return;

            // 阳光从天空掉落
            lastSunDrop += dt;
            if (lastSunDrop > 8000) {
                lastSunDrop = 0;
                spawnSun(80 + Math.random() * (W - 160), 0, true);
            }

            // 阳光收集物更新
            for (let i = suns.length - 1; i >= 0; i--) {
                const s = suns[i];
                if (s.fromSky && s.y < s.targetY) {
                    s.y += 0.6;
                }
                s.bob += 0.05;
                s.life -= dt;
                if (s.life <= 0) suns.splice(i, 1);
            }

            // 植物更新
            for (let i = plants.length - 1; i >= 0; i--) {
                const p = plants[i];
                const cfg = PLANTS[p.type];
                p.hurtFlash = Math.max(0, p.hurtFlash - dt / 50);

                if (cfg.type === 'sun') {
                    p.sunTimer -= dt;
                    if (p.sunTimer <= 0) {
                        p.sunTimer = 14000;
                        spawnSun(p.x + (Math.random() - 0.5) * 20, p.y - 20, false);
                    }
                } else if (cfg.type === 'shoot') {
                    p.shootTimer -= dt;
                    // 检查同行是否有僵尸
                    const hasZombie = zombies.some(z => z.row === p.row && z.x > p.x && z.x < W);
                    if (p.shootTimer <= 0 && hasZombie) {
                        p.shootTimer = 1500;
                        fireBullet(p);
                    }
                } else if (cfg.type === 'bomb') {
                    p.bombTimer -= dt;
                    if (p.bombTimer <= 0) {
                        explodeBomb(p);
                        plants.splice(i, 1);
                        continue;
                    }
                }

                if (p.hp <= 0) plants.splice(i, 1);
            }

            // 子弹更新
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx;
                b.life--;
                if (b.life <= 0 || b.x > W + 20) { bullets.splice(i, 1); continue; }
                // 碰撞僵尸
                for (let j = zombies.length - 1; j >= 0; j--) {
                    const z = zombies[j];
                    if (z.row === b.row && Math.abs(z.x - b.x) < 22 && z.hp > 0) {
                        z.hp -= b.damage;
                        z.hurtFlash = 8;
                        bullets.splice(i, 1);
                        // 命中粒子
                        for (let k = 0; k < 4; k++) {
                            particles.push({
                                x: b.x, y: b.y,
                                vx: (Math.random() - 0.5) * 3,
                                vy: (Math.random() - 0.5) * 3,
                                life: 12, maxLife: 12,
                                color: '#22c55e', size: 2
                            });
                        }
                        break;
                    }
                }
            }

            // 僵尸更新
            for (let i = zombies.length - 1; i >= 0; i--) {
                const z = zombies[i];
                z.hurtFlash = Math.max(0, z.hurtFlash - 1);
                z.walkPhase += 0.1;

                // 检查前方是否有植物
                const target = plants.find(p => p.row === z.row && Math.abs(p.x - z.x) < 30 && p.x < z.x);
                if (target) {
                    z.eating = target;
                    z.eatTimer += dt;
                    if (z.eatTimer > 500) {
                        z.eatTimer = 0;
                        target.hp -= z.damage;
                        target.hurtFlash = 8;
                    }
                } else {
                    z.eating = null;
                    z.x -= z.speed * (dt / 16);
                }

                if (z.hp <= 0) {
                    // 死亡粒子
                    for (let k = 0; k < 10; k++) {
                        particles.push({
                            x: z.x, y: z.y,
                            vx: (Math.random() - 0.5) * 4,
                            vy: -Math.random() * 3,
                            life: 25, maxLife: 25,
                            color: z.color, size: 2 + Math.random() * 3
                        });
                    }
                    zombies.splice(i, 1);
                    continue;
                }

                // 越界 = 游戏失败
                if (z.x < -10) {
                    endGame(false);
                    return;
                }
            }

            // 爆炸更新
            for (let i = explosions.length - 1; i >= 0; i--) {
                const e = explosions[i];
                e.life--;
                e.radius = e.maxRadius * (1 - e.life / e.maxLife);
                if (e.life <= 0) explosions.splice(i, 1);
            }

            // 粒子更新
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vy += 0.15;
                p.vx *= 0.95;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // 波次
            if (waveActive) {
                waveTimer += dt;
                if (zombiesSpawned < zombiesToSpawn && waveTimer > 2500) {
                    spawnZombie();
                    zombiesSpawned++;
                    waveTimer = 0;
                }
                if (zombiesSpawned >= zombiesToSpawn && zombies.length === 0) {
                    waveActive = false;
                    if (wave >= 8) {
                        endGame(true);
                        return;
                    }
                    // 奖励阳光
                    sun += 25;
                    updateSun();
                    renderCards();
                    setTimeout(() => { if (running && !gameOver) startNextWave(); }, 3000);
                }
            }

            updateCooldowns();
        }

        function draw() {
            // 草坪背景（条纹）
            for (let r = 0; r < ROWS; r++) {
                ctx.fillStyle = r % 2 === 0 ? '#5a8c3a' : '#4a7c3a';
                ctx.fillRect(0, r * CELL_H, W, CELL_H);
            }
            // 网格线
            ctx.strokeStyle = 'rgba(0,0,0,0.08)';
            ctx.lineWidth = 1;
            for (let c = 1; c < COLS; c++) {
                ctx.beginPath(); ctx.moveTo(c * CELL_W, 0); ctx.lineTo(c * CELL_W, H); ctx.stroke();
            }
            for (let r = 1; r < ROWS; r++) {
                ctx.beginPath(); ctx.moveTo(0, r * CELL_H); ctx.lineTo(W, r * CELL_H); ctx.stroke();
            }

            // 种植预览
            if (selectedPlant && mouseGrid) {
                const occupied = plants.some(p => p.col === mouseGrid.col && p.row === mouseGrid.row);
                ctx.fillStyle = occupied ? 'rgba(239,68,68,0.25)' : 'rgba(251,191,36,0.2)';
                ctx.fillRect(mouseGrid.col * CELL_W, mouseGrid.row * CELL_H, CELL_W, CELL_H);
                ctx.strokeStyle = occupied ? '#ef4444' : '#fbbf24';
                ctx.lineWidth = 2;
                ctx.strokeRect(mouseGrid.col * CELL_W + 1, mouseGrid.row * CELL_H + 1, CELL_W - 2, CELL_H - 2);
            }

            // 植物
            plants.forEach(p => drawPlant(p));

            // 子弹
            bullets.forEach(b => {
                ctx.save();
                ctx.shadowColor = '#22c55e';
                ctx.shadowBlur = 8;
                ctx.fillStyle = '#22c55e';
                ctx.beginPath();
                ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#86efac';
                ctx.beginPath();
                ctx.arc(b.x - 2, b.y - 1, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // 僵尸
            zombies.forEach(z => drawZombie(z));

            // 爆炸
            explosions.forEach(e => {
                ctx.save();
                const alpha = e.life / e.maxLife;
                const grad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.radius);
                grad.addColorStop(0, 'rgba(255,255,255,' + alpha + ')');
                grad.addColorStop(0.4, 'rgba(251,191,36,' + alpha * 0.8 + ')');
                grad.addColorStop(0.8, 'rgba(239,68,68,' + alpha * 0.6 + ')');
                grad.addColorStop(1, 'rgba(239,68,68,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // 阳光
            suns.forEach(s => {
                ctx.save();
                const bob = Math.sin(s.bob) * 3;
                const blink = s.life < 2000 ? (Math.floor(s.life / 200) % 2 ? 0.4 : 1) : 1;
                ctx.globalAlpha = blink;
                ctx.translate(s.x, s.y + bob);
                // 光晕
                const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, 22);
                glow.addColorStop(0, 'rgba(253, 224, 71, 0.8)');
                glow.addColorStop(1, 'rgba(253, 224, 71, 0)');
                ctx.fillStyle = glow;
                ctx.fillRect(-22, -22, 44, 44);
                // 太阳
                ctx.fillStyle = '#fde047';
                ctx.beginPath();
                ctx.arc(0, 0, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.arc(0, 0, 9, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // 粒子
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.life / p.maxLife;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // 波次提示
            if (waveActive && zombiesSpawned === 0 && wave > 0) {
                ctx.save();
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, W, 36);
                ctx.fillStyle = '#fbbf24';
                ctx.font = 'bold 18px "PingFang SC", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('第 ' + wave + ' 波 来袭！', W / 2, 24);
                ctx.restore();
            }
            if (!waveActive && running && !gameOver && zombies.length === 0 && wave > 0) {
                ctx.save();
                ctx.fillStyle = 'rgba(34,197,94,0.9)';
                ctx.font = 'bold 16px "PingFang SC", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('波次清理！准备下一波…', W / 2, 24);
                ctx.restore();
            }
        }

        function drawPlant(p) {
            const cfg = PLANTS[p.type];
            ctx.save();
            ctx.translate(p.x, p.y);
            const hurt = p.hurtFlash > 0;

            if (p.type === 'sunflower') {
                // 茎
                ctx.fillStyle = '#16a34a';
                ctx.fillRect(-3, 0, 6, 18);
                // 花瓣
                ctx.fillStyle = hurt ? '#fff' : '#fbbf24';
                for (let i = 0; i < 8; i++) {
                    const a = (i / 8) * Math.PI * 2;
                    ctx.beginPath();
                    ctx.ellipse(Math.cos(a) * 18, Math.sin(a) * 18 - 8, 9, 6, a, 0, Math.PI * 2);
                    ctx.fill();
                }
                // 花心
                ctx.fillStyle = '#92400e';
                ctx.beginPath();
                ctx.arc(0, -8, 11, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fbbf24';
                ctx.beginPath();
                ctx.arc(0, -8, 7, 0, Math.PI * 2);
                ctx.fill();
                // 眼睛
                ctx.fillStyle = '#0a0a14';
                ctx.beginPath(); ctx.arc(-3, -9, 1.5, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(3, -9, 1.5, 0, Math.PI * 2); ctx.fill();
            } else if (p.type === 'peashooter') {
                // 茎
                ctx.fillStyle = '#16a34a';
                ctx.fillRect(-3, 0, 6, 22);
                // 叶子
                ctx.fillStyle = '#22c55e';
                ctx.beginPath(); ctx.ellipse(-10, 10, 8, 4, -0.5, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(10, 14, 8, 4, 0.5, 0, Math.PI * 2); ctx.fill();
                // 头
                ctx.fillStyle = hurt ? '#fff' : '#22c55e';
                ctx.beginPath();
                ctx.arc(0, -8, 14, 0, Math.PI * 2);
                ctx.fill();
                // 嘴管
                ctx.fillStyle = '#16a34a';
                ctx.beginPath();
                ctx.ellipse(14, -8, 8, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                // 眼睛
                ctx.fillStyle = '#0a0a14';
                ctx.beginPath(); ctx.arc(-2, -10, 2.5, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(-1, -11, 1, 0, Math.PI * 2); ctx.fill();
            } else if (p.type === 'wallnut') {
                // 坚果
                ctx.fillStyle = hurt ? '#fff' : '#a78bfa';
                ctx.beginPath();
                ctx.ellipse(0, 0, 20, 24, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#7c3aed';
                ctx.beginPath();
                ctx.ellipse(0, 6, 16, 16, 0, 0, Math.PI);
                ctx.fill();
                // 裂纹随血量
                const dmgRatio = 1 - p.hp / p.maxHp;
                if (dmgRatio > 0.3) {
                    ctx.strokeStyle = '#451a03';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(-8, -10); ctx.lineTo(-4, -2); ctx.lineTo(-7, 5);
                    ctx.stroke();
                }
                if (dmgRatio > 0.6) {
                    ctx.beginPath();
                    ctx.moveTo(6, -8); ctx.lineTo(2, 2); ctx.lineTo(5, 10);
                    ctx.stroke();
                }
                // 眼睛
                ctx.fillStyle = '#0a0a14';
                ctx.beginPath(); ctx.arc(-5, -5, 2, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(5, -5, 2, 0, Math.PI * 2); ctx.fill();
            } else if (p.type === 'cherry') {
                // 樱桃炸弹（闪烁）
                const flash = Math.floor(p.bombTimer / 100) % 2;
                ctx.fillStyle = hurt || flash ? '#fff' : '#ef4444';
                ctx.beginPath();
                ctx.arc(-8, 0, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(8, 2, 12, 0, Math.PI * 2);
                ctx.fill();
                // 茎
                ctx.strokeStyle = '#16a34a';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-8, -10); ctx.quadraticCurveTo(0, -20, 8, -8);
                ctx.stroke();
                // 引信火花
                ctx.fillStyle = '#fde047';
                ctx.beginPath();
                ctx.arc(0, -18, 3, 0, Math.PI * 2);
                ctx.fill();
                // 眼睛
                ctx.fillStyle = '#0a0a14';
                ctx.beginPath(); ctx.arc(-11, -2, 1.5, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(-5, -2, 1.5, 0, Math.PI * 2); ctx.fill();
            }

            // 血条（受伤时显示）
            if (p.hp < p.maxHp) {
                const bw = 30;
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fillRect(-bw / 2, -28, bw, 3);
                ctx.fillStyle = '#22c55e';
                ctx.fillRect(-bw / 2, -28, bw * (p.hp / p.maxHp), 3);
            }
            ctx.restore();
        }

        function drawZombie(z) {
            ctx.save();
            ctx.translate(z.x, z.y);
            const bob = Math.sin(z.walkPhase) * 2;
            const hurt = z.hurtFlash > 0;

            // 阴影
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(0, 22, 16, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            // 腿
            ctx.fillStyle = '#475569';
            const legOffset = Math.sin(z.walkPhase) * 4;
            ctx.fillRect(-7, 8, 5, 14 + legOffset);
            ctx.fillRect(2, 8, 5, 14 - legOffset);

            // 身体
            ctx.fillStyle = hurt ? '#fff' : z.color;
            ctx.fillRect(-10, -8 + bob, 20, 18);

            // 手臂（前伸）
            ctx.fillStyle = hurt ? '#fff' : z.color;
            ctx.fillRect(-18, -4 + bob, 10, 6);
            ctx.fillRect(8, -4 + bob, 10, 6);

            // 头
            ctx.fillStyle = hurt ? '#fff' : '#cbd5e1';
            ctx.beginPath();
            ctx.arc(0, -14 + bob, 10, 0, Math.PI * 2);
            ctx.fill();

            // 眼睛
            ctx.fillStyle = '#ef4444';
            ctx.beginPath(); ctx.arc(-3, -14 + bob, 1.8, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(3, -14 + bob, 1.8, 0, Math.PI * 2); ctx.fill();

            // 嘴
            ctx.fillStyle = '#0a0a14';
            ctx.fillRect(-3, -9 + bob, 6, 2);

            // 防具
            if (z.type === 'cone') {
                ctx.fillStyle = hurt ? '#fff' : '#f97316';
                ctx.beginPath();
                ctx.moveTo(-8, -20 + bob);
                ctx.lineTo(8, -20 + bob);
                ctx.lineTo(0, -36 + bob);
                ctx.closePath();
                ctx.fill();
                // 条纹
                ctx.strokeStyle = '#9a3412';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(-5, -25 + bob); ctx.lineTo(5, -25 + bob);
                ctx.stroke();
            } else if (z.type === 'bucket') {
                ctx.fillStyle = hurt ? '#fff' : '#64748b';
                ctx.fillRect(-11, -26 + bob, 22, 12);
                ctx.fillStyle = '#475569';
                ctx.fillRect(-11, -26 + bob, 22, 2);
                ctx.fillRect(-11, -16 + bob, 22, 2);
            }

            // 血条
            if (z.hp < z.maxHp) {
                const bw = 30;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(-bw / 2, -36 + bob, bw, 3);
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(-bw / 2, -36 + bob, bw * (z.hp / z.maxHp), 3);
            }
            ctx.restore();
        }

        function endGame(victory) {
            gameOver = true;
            running = false;
            if (victory) {
                win = true;
                overlayTitle.textContent = '胜利！';
                overlayText.innerHTML = '你成功守住了 8 波僵尸的进攻！<br>花园安全了 🌻';
            } else {
                overlayTitle.textContent = '游戏结束';
                overlayText.innerHTML = '僵尸吃掉了你的脑子…<br>抵达第 ' + wave + ' 波';
            }
            startBtn.textContent = '再玩一次';
            overlay.classList.remove('hidden');
        }

        function loop(now) {
            if (!running) return;
            const dt = Math.min(33, now - lastTime);
            lastTime = now;
            update(dt);
            draw();
            requestAnimationFrame(loop);
        }

        // 输入
        function getGridPos(e) {
            const rect = canvas.getBoundingClientRect();
            const sx = canvas.width / rect.width;
            const sy = canvas.height / rect.height;
            const x = (e.clientX - rect.left) * sx;
            const y = (e.clientY - rect.top) * sy;
            const col = Math.floor(x / CELL_W);
            const row = Math.floor(y / CELL_H);
            if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return null;
            return { col, row, x, y };
        }

        canvas.addEventListener('mousemove', e => {
            mouseGrid = getGridPos(e);
        });
        canvas.addEventListener('mouseleave', () => { mouseGrid = null; });

        canvas.addEventListener('click', e => {
            if (!running || gameOver) return;
            const pos = getGridPos(e);
            if (!pos) return;

            // 优先收集阳光
            const rect = canvas.getBoundingClientRect();
            const sx = canvas.width / rect.width;
            const sy = canvas.height / rect.height;
            const cx = (e.clientX - rect.left) * sx;
            const cy = (e.clientY - rect.top) * sy;

            let collected = false;
            for (let i = suns.length - 1; i >= 0; i--) {
                const s = suns[i];
                if (Math.hypot(cx - s.x, cy - s.y) < 20) {
                    collectSun(s);
                    suns.splice(i, 1);
                    collected = true;
                    break;
                }
            }
            if (collected) return;

            // 种植
            if (selectedPlant) {
                plantAt(pos.col, pos.row);
            }
        });

        // 键盘快捷
        document.addEventListener('keydown', e => {
            if (!running) return;
            const k = e.key;
            if (k >= '1' && k <= '4') {
                selectPlant(PLANT_KEYS[parseInt(k) - 1]);
            } else if (k === 'Escape') {
                selectedPlant = null;
                renderCards();
            }
        });

        startBtn.addEventListener('click', startGame);

        // 初始画面
        reset();
        // 绘制草坪
        for (let r = 0; r < ROWS; r++) {
            ctx.fillStyle = r % 2 === 0 ? '#5a8c3a' : '#4a7c3a';
            ctx.fillRect(0, r * CELL_H, W, CELL_H);
        }
    })();
    </script>
</body>
</html>
